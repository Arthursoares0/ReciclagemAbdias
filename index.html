<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pódio de Equipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }

        @keyframes riseUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .podium-step { animation: riseUp 0.8s ease-out forwards; transform-origin: bottom; }
        .step-1 { animation-delay: 0.1s; }
        .step-2 { animation-delay: 0.4s; }
        .step-3 { animation-delay: 0.7s; }

        .gold-gradient { background: linear-gradient(135deg, #FDE047 0%, #EAB308 50%, #CA8A04 100%); box-shadow: 0 10px 15px -3px rgba(234, 179, 8, 0.4); }
        .silver-gradient { background: linear-gradient(135deg, #F3F4F6 0%, #D1D5DB 50%, #9CA3AF 100%); box-shadow: 0 10px 15px -3px rgba(156, 163, 175, 0.4); }
        .bronze-gradient { background: linear-gradient(135deg, #FDBA74 0%, #EA580C 50%, #9A3412 100%); box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.4); }

        .height-1 { height: 180px; }
        .height-2 { height: 130px; }
        .height-3 { height: 90px; }
        @media (min-width: 768px) {
            .height-1 { height: 250px; }
            .height-2 { height: 180px; }
            .height-3 { height: 120px; }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl p-6 md:p-12">

        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 tracking-tight mb-3">Ranking Geral</h1>
            <p class="text-gray-500 text-lg">Classificação baseada na soma total de pontos</p>
        </header>

        <!-- Total de material recolhido -->
        <div class="mb-12 flex flex-col items-center justify-center rounded-2xl bg-emerald-50 border border-emerald-200 py-6 px-4">
            <span class="text-sm font-semibold uppercase tracking-wider text-emerald-700">Total de material recolhido</span>
            <span id="total-peso" class="text-4xl md:text-5xl font-extrabold text-emerald-800 mt-1">0 kg</span>
        </div>

        <!-- Container do Pódio -->
        <div id="podium-container" class="flex justify-center items-end gap-2 md:gap-6 border-b-2 border-gray-100 pb-2 mb-10 overflow-hidden relative min-h-[250px] md:min-h-[320px]"></div>

        <!-- Tabela das equipes restantes -->
        <div class="overflow-x-auto">
            <h2 class="text-xl font-bold text-gray-700 mb-4 px-2">Outras Classificações</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider">
                        <th class="py-4 px-6 font-semibold rounded-tl-lg rounded-bl-lg">Posição</th>
                        <th class="py-4 px-6 font-semibold">Equipe</th>
                        <th class="py-4 px-6 font-semibold text-right">Peso coletado</th>
                        <th class="py-4 px-6 font-semibold rounded-tr-lg rounded-br-lg text-right">Pontos Totais</th>
                    </tr>
                </thead>
                <tbody id="ranking-table-body" class="divide-y divide-gray-100"></tbody>
            </table>
            <p class="mt-4 px-2 text-sm text-gray-500 flex items-center gap-2">
                <span class="inline-block w-3 h-3 rounded-full bg-red-500"></span>
                Turmas com menos de 5 kg coletados
            </p>
        </div>

    </div>

    <script>
        // Limite mínimo de peso (kg). Turmas abaixo disso ficam em vermelho.
        const LIMITE_KG = 5;

        // Dados: pontos e peso coletado (kg) de cada equipe
        const equipes = [
            { nome: '1°ST', peso: 45.88, pontos: [54.5, 14, 10, 19.8, 26.3, 43.84, 133.52, 81.7, 15.4] },
            { nome: 'Info', peso: 14.38, pontos: [23, 30, 4, 3.1, 17.8, 64] },
            { nome: '2° DS Manhã', peso: 5.35, pontos: [36.7, 3.4, 3.4, 5.6] },
            { nome: '1° DS Manhã', peso: 34.62, pontos: [22, 10, 27, 7, 38.8, 32, 39.9, 29.26, 2.5, 10.8] },
            { nome: '2°RH', peso: 14.08, pontos: [15, 12, 7, 29, 11.3, 44.34] },
            { nome: '1°RH', peso: 23.76, pontos: [9.2, 221.56] },
            { nome: '2°ST', peso: 0.2, pontos: [14.1] },
            { nome: '1°DS Tarde', peso: 3.76, pontos: [6.4, 12.2, 21] },
            { nome: '2°ADM Manhã', peso: 1.46, pontos: [11.68] }
        ];

        const formatarKg = (n) => n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' kg';
        const abaixoDoLimite = (peso) => peso < LIMITE_KG;

        function prepararRanking(dados) {
            const classificacao = dados.map(equipe => {
                const totalDePontos = equipe.pontos.reduce((acc, v) => acc + v, 0);
                return {
                    nome: equipe.nome,
                    peso: equipe.peso,
                    total: Number(totalDePontos.toFixed(2))
                };
            });
            classificacao.sort((a, b) => b.total - a.total);
            return classificacao;
        }

        function renderizarTotalPeso(dados) {
            const total = dados.reduce((acc, e) => acc + e.peso, 0);
            document.getElementById('total-peso').textContent = formatarKg(total);
        }

        function renderizarPodio(top3) {
            const podiumContainer = document.getElementById('podium-container');
            podiumContainer.innerHTML = '';
            if (top3.length === 0) return;

            const ordemVisual = [];
            if (top3[1]) ordemVisual.push({ ...top3[1], pos: 2, classes: 'silver-gradient height-2 step-2' });
            if (top3[0]) ordemVisual.push({ ...top3[0], pos: 1, classes: 'gold-gradient height-1 step-1' });
            if (top3[2]) ordemVisual.push({ ...top3[2], pos: 3, classes: 'bronze-gradient height-3 step-3' });

            ordemVisual.forEach(equipe => {
                const vermelho = abaixoDoLimite(equipe.peso);
                const corNome = vermelho ? 'text-red-600' : 'text-gray-800';
                const corPeso = vermelho ? 'text-red-600 font-bold' : 'text-emerald-700 font-semibold';
                const stepHTML = `
                    <div class="flex flex-col items-center w-24 md:w-32 flex-shrink-0 z-10">
                        <div class="mb-2 text-center opacity-0 podium-step" style="animation-delay: ${equipe.pos === 1 ? '0.6s' : equipe.pos === 2 ? '0.8s' : '1s'}">
                            <div class="font-bold ${corNome} text-sm md:text-lg truncate w-24 md:w-32 px-1" title="${equipe.nome}">${equipe.nome}</div>
                            <div class="text-xs md:text-sm font-semibold text-gray-500">${equipe.total} pts</div>
                            <div class="text-xs md:text-sm ${corPeso}">${formatarKg(equipe.peso)}</div>
                        </div>
                        <div class="w-full flex flex-col justify-start items-center rounded-t-xl ${equipe.classes} podium-step relative text-white border-b-0 border-white shadow-inner">
                            <span class="mt-4 text-3xl md:text-5xl font-black opacity-80 drop-shadow-md text-white">${equipe.pos}º</span>
                        </div>
                    </div>
                `;
                podiumContainer.innerHTML += stepHTML;
            });
        }

        function renderizarTabela(restantes) {
            const tableBody = document.getElementById('ranking-table-body');
            tableBody.innerHTML = '';

            if (restantes.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400">Nenhuma outra equipe classificada.</td></tr>`;
                return;
            }

            restantes.forEach((equipe, index) => {
                const posicaoReal = index + 4;
                const vermelho = abaixoDoLimite(equipe.peso);

                const tr = document.createElement('tr');
                tr.className = 'transition-colors duration-200 group ' + (vermelho ? 'bg-red-50 hover:bg-red-100' : 'hover:bg-gray-50');

                tr.innerHTML = `
                    <td class="py-4 px-6 text-gray-500 font-medium">
                        <span class="inline-block w-8 h-8 rounded-full bg-gray-100 text-center leading-8 group-hover:bg-gray-200 transition-colors">${posicaoReal}º</span>
                    </td>
                    <td class="py-4 px-6">
                        <div class="font-semibold text-base ${vermelho ? 'text-red-600' : 'text-gray-800'}">${equipe.nome}</div>
                    </td>
                    <td class="py-4 px-6 text-right">
                        <span class="inline-block px-3 py-1 font-bold rounded-full text-sm ${vermelho ? 'bg-red-100 text-red-700' : 'bg-emerald-50 text-emerald-700'}">
                            ${formatarKg(equipe.peso)}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-right">
                        <span class="inline-block px-3 py-1 bg-blue-50 text-blue-700 font-bold rounded-full text-sm">
                            ${equipe.total}
                        </span>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function iniciarAplicacao() {
            const rankingFinal = prepararRanking(equipes);
            renderizarTotalPeso(equipes);
            renderizarPodio(rankingFinal.slice(0, 3));
            renderizarTabela(rankingFinal.slice(3));
        }

        document.addEventListener('DOMContentLoaded', iniciarAplicacao);
    </script>
</body>
</html>
