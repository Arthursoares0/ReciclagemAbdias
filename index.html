<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pódio de Equipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* gray-100 */
        }

        /* Animação para o pódio subir suavemente */
        @keyframes riseUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .podium-step {
            animation: riseUp 0.8s ease-out forwards;
            transform-origin: bottom;
        }

        /* Atrasos nas animações para dar um efeito cascata (1º, depois 2º, depois 3º) */
        .step-1 { animation-delay: 0.1s; }
        .step-2 { animation-delay: 0.4s; }
        .step-3 { animation-delay: 0.7s; }

        /* Gradientes e sombras para os blocos do pódio */
        .gold-gradient {
            background: linear-gradient(135deg, #FDE047 0%, #EAB308 50%, #CA8A04 100%);
            box-shadow: 0 10px 15px -3px rgba(234, 179, 8, 0.4);
        }
        .silver-gradient {
            background: linear-gradient(135deg, #F3F4F6 0%, #D1D5DB 50%, #9CA3AF 100%);
            box-shadow: 0 10px 15px -3px rgba(156, 163, 175, 0.4);
        }
        .bronze-gradient {
            background: linear-gradient(135deg, #FDBA74 0%, #EA580C 50%, #9A3412 100%);
            box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.4);
        }

        /* Alturas dinâmicas do pódio para Desktop e Mobile */
        .height-1 { height: 180px; }
        .height-2 { height: 130px; }
        .height-3 { height: 90px; }

        @media (min-width: 768px) {
            .height-1 { height: 250px; }
            .height-2 { height: 180px; }
            .height-3 { height: 120px; }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl p-6 md:p-12">
        
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 tracking-tight mb-3">Ranking Geral</h1>
            <p class="text-gray-500 text-lg">Classificação baseada na soma total de pontos</p>
        </header>

        <!-- Container do Pódio -->
        <div id="podium-container" class="flex justify-center items-end gap-2 md:gap-6 border-b-2 border-gray-100 pb-2 mb-10 overflow-hidden relative min-h-[250px] md:min-h-[320px]">
            <!-- Os elementos do pódio serão inseridos aqui via JS -->
        </div>

        <!-- Tabela das equipes restantes -->
        <div class="overflow-x-auto">
            <h2 class="text-xl font-bold text-gray-700 mb-4 px-2">Outras Classificações</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider rounded-t-lg">
                        <th class="py-4 px-6 font-semibold rounded-tl-lg rounded-bl-lg">Posição</th>
                        <th class="py-4 px-6 font-semibold">Equipe</th>
                        <th class="py-4 px-6 font-semibold rounded-tr-lg rounded-br-lg text-right">Pontos Totais</th>
                    </tr>
                </thead>
                <tbody id="ranking-table-body" class="divide-y divide-gray-100">
                    <!-- As linhas da tabela serão inseridas aqui via JS -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // 1. Dados iniciais: Array de equipes com nome e array de pontos
        const equipes = [
            { nome: '1°ST', pontos: [54.5, 14, 10.2] },    
            { nome: 'Info', pontos: [23.6, 30.9, 4] },        
            { nome: '2° DS Manhã', pontos: [36.7] },    
            { nome: '1° DS Manhã', pontos: [22, 10, 27, 7.7] },         
            { nome: '2°RH', pontos: [15, 12.6] },     
            { nome: '1°RH', pontos: [9.2] },
            { nome: '2°ST', pontos: [13.1] }
        ];

        // 2. Processamento dos dados
        function prepararRanking(dados) {
            // Usa o reduce para calcular a soma total e retorna um novo array com os totais
            const classificacao = dados.map(equipe => {
                const totalDePontos = equipe.pontos.reduce((acumulador, valorAtual) => acumulador + valorAtual, 0);
                return {
                    nome: equipe.nome,
                    total: totalDePontos
                };
            });

            // Ordena o array do maior para o menor (ordem decrescente)
            classificacao.sort((a, b) => b.total - a.total);
            return classificacao;
        }

        function renderizarPodio(top3) {
            const podiumContainer = document.getElementById('podium-container');
            podiumContainer.innerHTML = ''; // Limpa o container

            if (top3.length === 0) return;

            // Mapeamento visual para o pódio (Centro: 1º, Esquerda: 2º, Direita: 3º)
            // Ordem no array para exibição no Flexbox (esquerda para direita): 2º lugar, 1º lugar, 3º lugar
            const ordemVisual = [];
            
            // 2º Lugar
            if (top3[1]) ordemVisual.push({ ...top3[1], pos: 2, classes: 'silver-gradient height-2 step-2', labelBg: 'bg-gray-300 text-gray-800' });
            // 1º Lugar
            if (top3[0]) ordemVisual.push({ ...top3[0], pos: 1, classes: 'gold-gradient height-1 step-1', labelBg: 'bg-yellow-400 text-yellow-900' });
            // 3º Lugar
            if (top3[2]) ordemVisual.push({ ...top3[2], pos: 3, classes: 'bronze-gradient height-3 step-3', labelBg: 'bg-orange-400 text-orange-950' });

            ordemVisual.forEach(equipe => {
                const stepHTML = `
                    <div class="flex flex-col items-center w-24 md:w-32 flex-shrink-0 z-10">
                        <div class="mb-2 text-center opacity-0 podium-step" style="animation-delay: ${equipe.pos === 1 ? '0.6s' : equipe.pos === 2 ? '0.8s' : '1s'}">
                            <div class="font-bold text-gray-800 text-sm md:text-lg truncate w-24 md:w-32 px-1" title="${equipe.nome}">${equipe.nome}</div>
                            <div class="text-xs md:text-sm font-semibold text-gray-500">${equipe.total} pts</div>
                        </div>
                        <div class="w-full flex flex-col justify-start items-center rounded-t-xl ${equipe.classes} podium-step relative text-white border-b-0 border-white shadow-inner">
                            <span class="mt-4 text-3xl md:text-5xl font-black opacity-80 drop-shadow-md text-white">${equipe.pos}º</span>
                        </div>
                    </div>
                `;
                podiumContainer.innerHTML += stepHTML;
            });
        }

        function renderizarTabela(restantes) {
            const tableBody = document.getElementById('ranking-table-body');
            tableBody.innerHTML = ''; // Limpa o container

            if (restantes.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="text-center py-6 text-gray-400">Nenhuma outra equipe classificada.</td></tr>`;
                return;
            }

            restantes.forEach((equipe, index) => {
                // Como 'restantes' começa do 4º lugar, a posição real é index + 4
                const posicaoReal = index + 4;
                
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors duration-200 group';
                
                tr.innerHTML = `
                    <td class="py-4 px-6 text-gray-500 font-medium">
                        <span class="inline-block w-8 h-8 rounded-full bg-gray-100 text-center leading-8 group-hover:bg-gray-200 transition-colors">${posicaoReal}º</span>
                    </td>
                    <td class="py-4 px-6">
                        <div class="font-semibold text-gray-800 text-base">${equipe.nome}</div>
                    </td>
                    <td class="py-4 px-6 text-right">
                        <span class="inline-block px-3 py-1 bg-blue-50 text-blue-700 font-bold rounded-full text-sm">
                            ${equipe.total}
                        </span>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function iniciarAplicacao() {
            // Calcula e ordena
            const rankingFinal = prepararRanking(equipes);

            // Separa o top 3 do restante
            const top3 = rankingFinal.slice(0, 3);
            const restantes = rankingFinal.slice(3);

            // Renderiza na tela
            renderizarPodio(top3);
            renderizarTabela(restantes);
        }

        // Executa quando a página terminar de carregar
        document.addEventListener('DOMContentLoaded', iniciarAplicacao);

    </script>
</body>
</html>
